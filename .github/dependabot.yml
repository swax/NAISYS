version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Let routine releases age; Dependabot security fixes bypass this delay.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      routine:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
